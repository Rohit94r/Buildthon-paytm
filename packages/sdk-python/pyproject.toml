[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layerflow"
version = "1.0.0"
description = "Python client for the LayerFlow public API: content, datasets, assistant, workflow/agent runs, webhook verification."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[tool.setuptools]
packages = ["layerflow"]
